name: Deploy web app to GitHub Pages

# Publishes the app as a website so it can be tried from any phone or browser
# without installing anything. One-time setup: Settings → Pages → Source:
# "GitHub Actions".
on:
  push:
    branches: ['main', 'claude/school-parent-feedback-app-up0580']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure single-page web build under /<repo-name>
        run: |
          jq --arg base "/${{ github.event.repository.name }}" \
            '.expo.web.output = "single" | .expo.experiments.baseUrl = $base' \
            app.json > app.pages.json
          mv app.pages.json app.json
      - name: Export web build
        run: npx expo export --platform web --output-dir dist
      - name: Serve the app for deep links (e.g. /report/r1)
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
