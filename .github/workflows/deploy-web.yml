name: Deploy website to GitHub Pages

# Publishes the marketing website at /<repo>/ and the parent-app demo at
# /<repo>/app/. One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: ['main', 'claude/school-parent-feedback-app-up0580']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}
      # Optional: Settings → Secrets and variables → Actions → Variables.
      NEXT_PUBLIC_ORDER_WEBHOOK_URL: ${{ vars.ORDER_WEBHOOK_URL }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Build marketing website
        working-directory: website
        run: |
          npm ci
          npx next build
      - run: mv website/out site

      - name: Build parent-app demo under /app
        run: |
          npm ci
          jq --arg base "$BASE_PATH/app" \
            '.expo.web.output = "single" | .expo.experiments.baseUrl = $base' \
            app.json > app.pages.json
          mv app.pages.json app.json
          npx expo export --platform web --output-dir site/app

      # The website's 404 page sends refreshed demo URLs (e.g. /app/report/r1)
      # back into the demo.
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
