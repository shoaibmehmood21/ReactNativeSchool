name: Build Android APK

on:
  push:
    tags: ['v*']
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'website/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Assemble release APK
        working-directory: android
        # Only real-device ABIs, to keep the APK small and the build fast.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk school-connect.apk
      - uses: actions/upload-artifact@v4
        with:
          name: school-connect-android-apk
          path: school-connect.apk
      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: school-connect.apk
